# A sample pack. Copy this file to make your own: any set of things works,
# as long as the questions can tell every item apart.
#
# A question id listed under an item's `yes` is true for it, under `maybe`
# is true only sometimes or open to argument, and anything not listed is
# false. `say` is how the name is spoken in "Is it ...?".
name: Animals
thing: an animal
questions:
  - {id: fur, ask: "Does it have fur or hair?"}
  - {id: feathers, ask: "Does it have feathers?"}
  - {id: flies, ask: "Can it fly?"}
  - {id: water, ask: "Does it live in the water?"}
  - {id: swims, ask: "Is it a good swimmer?"}
  - {id: legs4, ask: "Does it walk on four legs?"}
  - {id: nolegs, ask: "Does it have no legs at all?"}
  - {id: manylegs, ask: "Does it have more than four legs?"}
  - {id: big, ask: "Is it bigger than a grown-up person?"}
  - {id: tiny, ask: "Could it sit in your hand?"}
  - {id: pet, ask: "Do people keep it as a pet at home?"}
  - {id: farm, ask: "Does it live on a farm?"}
  - {id: meat, ask: "Does it eat other animals?"}
  - {id: stripes, ask: "Does it have stripes or spots?"}
  - {id: cold, ask: "Does it live where it is very cold?"}
  - {id: africa, ask: "Does it live in Africa?"}
  - {id: eggs, ask: "Does it lay eggs?"}
  - {id: shell, ask: "Does it have a shell?"}
  - {id: jumps, ask: "Is it known for jumping or hopping?"}
  - {id: trees, ask: "Does it climb trees?"}
  - {id: horns, ask: "Does it have horns, antlers or tusks?"}
  - {id: scary, ask: "Would most people be scared to meet one?"}
  - {id: longneck, ask: "Does it have a very long neck or a very long nose?"}
  - {id: night, ask: "Is it mostly awake at night?"}
  - {id: wool, ask: "Do people make wool from its coat?"}
