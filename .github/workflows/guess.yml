name: Guess

on:
  push:
    paths: ["guess/**", ".github/workflows/guess.yml"]
  pull_request:
    paths: ["guess/**", ".github/workflows/guess.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guess
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: guess/go.mod
          cache-dependency-path: guess/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/gostt-guess

      - name: Check the sample pack
        run: ./gostt-guess pack packs/animals.yaml

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh
