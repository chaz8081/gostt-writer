name: Pad

on:
  push:
    paths: ["pad/**", ".github/workflows/pad.yml"]
  pull_request:
    paths: ["pad/**", ".github/workflows/pad.yml"]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pad
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: pad/go.mod
          cache-dependency-path: pad/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./cmd/gostt-pad

      - name: Lint shell scripts
        run: shellcheck deploy/*.sh
